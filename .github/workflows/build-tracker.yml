name: Build Drop Rig Tracker
on:
  workflow_dispatch:
  push:
    paths:
      - 'tracker/**'
      - '.github/workflows/build-tracker.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: drop-rig-tracker-1.2.0
          path: tracker/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
