name: Decompile Drop Rig JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "drop-rig-1.1.0-stable.jar"
      - ".github/workflows/decompile.yml"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download CFR decompiler
        run: |
          curl -fL --retry 3 \
            https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar \
            -o cfr.jar

      - name: Decompile the mod
        run: |
          test -f drop-rig-1.1.0-stable.jar
          mkdir -p decompiled
          java -jar cfr.jar drop-rig-1.1.0-stable.jar --outputdir decompiled

      - name: Package decompiled source
        run: |
          zip -qr drop-rig-decompiled.zip decompiled

      - name: Upload decompiled source artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop-rig-decompiled-source
          path: drop-rig-decompiled.zip
          if-no-files-found: error
          retention-days: 7
